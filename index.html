<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Hex World</title>
  <link rel="stylesheet" href="src/ui/ui.css">
</head>
<body>
  <div id="stage">
    <canvas id="view"></canvas>

    <!-- World-anchored context buttons; positioned by the camera transform. -->
    <div id="worldspace"></div>

    <!-- Top-left status readout. -->
    <div id="hud">
      <div id="hud-stats"></div>
      <div id="hud-skills"></div>
      <div id="hud-terrain" class="dim"></div>
    </div>

    <!-- Bottom bar: the panel buttons. -->
    <nav id="taskbar"></nav>

    <div id="notifications"></div>
    <div id="modal-root"></div>
  </div>

  <noscript>This game needs JavaScript.</noscript>
  <script type="module" src="src/main.js"></script>
</body>
</html>
