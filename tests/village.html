<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Three.js Village Tile - Sculpted Thatch</title>
    <style>
        body { margin: 0; overflow: hidden; background-color: #f0f0f0; font-family: sans-serif; }
        #info {
            position: absolute; top: 10px; width: 100%; text-align: center;
            z-index: 10; padding: 10px; pointer-events: none;
        }
        #regenButton {
            pointer-events: auto; margin-top: 10px; padding: 8px 16px;
            background: #007aff; color: white; border: none; border-radius: 6px; cursor: pointer;
        }
    </style>
</head>
<body>
    <div id="info">
        <button id="regenButton">Regenerate Village</button>
    </div>
    <canvas id="c"></canvas>

    <script type="importmap">
        {
            "imports": {
                "three": "https://cdnjs.cloudflare.com/ajax/libs/three.js/0.167.1/three.module.js",
                "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.167.1/examples/jsm/"
            }
        }
    </script>

    <script type="module">
        import * as THREE from 'three';
        import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
        import { mergeGeometries } from 'three/addons/utils/BufferGeometryUtils.js';
        import { RoundedBoxGeometry } from 'three/addons/geometries/RoundedBoxGeometry.js';


        let scene, camera, renderer, controls;
        let tileGroup; // Group to hold the entire tile
        const rand = (min, max) => Math.random() * (max - min) + min;

        // --- Palettes ---
        const STONE_COLORS = [
            new THREE.Color(0x8a8a8a), // light gray
            new THREE.Color(0x9a9a9a), // medium gray
            new THREE.Color(0x7a7a7a), // dark gray
            new THREE.Color(0x948f8a)  // brownish gray
        ];
        
        // --- Procedural Base64 Thatch Texture Generator ---
        let thatchTexture = null;
        let thatchEdgeMaterial = null; 

        function generateThatchTexture() {
            if (thatchTexture) return thatchTexture; 

            const canvas = document.createElement('canvas');
            canvas.width = 64;  
            canvas.height = 128; 
            const ctx = canvas.getContext('2d');

            const bgColor = '#6d4c41'; // Dark straw/brown background
            ctx.fillStyle = bgColor;
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            // Draw 300 "strands"
            for (let i = 0; i < 300; i++) {
                const x = rand(0, canvas.width);
                const y = rand(-10, canvas.height + 10); 
                const length = rand(20, 80);
                const thick = rand(1, 2.5);
                
                const r = 160 + rand(0, 50); // 160-210
                const g = 110 + rand(0, 50); // 110-160
                const b = 40 + rand(0, 30);  // 40-70
                ctx.strokeStyle = `rgba(${r}, ${g}, ${b}, 0.8)`;
                ctx.lineWidth = thick;
                
                ctx.beginPath();
                ctx.moveTo(x + rand(-2, 2), y);
                ctx.lineTo(x + rand(-4, 4), y + length / 2);
                ctx.lineTo(x + rand(-2, 2), y + length);
                ctx.stroke();
            }

            const dataUrl = canvas.toDataURL('image/png');
            thatchTexture = new THREE.TextureLoader().load(dataUrl);
            thatchTexture.wrapS = THREE.RepeatWrapping;
            thatchTexture.wrapT = THREE.RepeatWrapping;
            thatchTexture.repeat.set(4, 6); 

            // --- Create edge material ---
            thatchEdgeMaterial = new THREE.MeshStandardMaterial({ 
                color: bgColor,
                roughness: 0.9,
                side: THREE.DoubleSide // Make sure gable is visible from both sides
            });

            return thatchTexture;
        }


        function init() {
            scene = new THREE.Scene();
            scene.background = new THREE.Color(0xf0f0f0);
            scene.fog = new THREE.Fog(0xf0f0f0, 20, 60);

            camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
            camera.position.set(0, 12, 18);

            renderer = new THREE.WebGLRenderer({ antialias: true, canvas: document.querySelector('#c') });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.shadowMap.enabled = true;
            renderer.shadowMap.type = THREE.PCFSoftShadowMap;

            // --- Lighting ---
            const ambientLight = new THREE.AmbientLight(0xffffff, 0.5);
            scene.add(ambientLight);

            const sunLight = new THREE.DirectionalLight(0xffddaa, 1.0);
            sunLight.position.set(10, 20, 10);
            sunLight.castShadow = true;
            sunLight.shadow.mapSize.width = 2048;
            sunLight.shadow.mapSize.height = 2048;
            sunLight.shadow.camera.near = 0.5;
            sunLight.shadow.camera.far = 50;
            sunLight.shadow.camera.left = -15;
            sunLight.shadow.camera.right = 15;
            sunLight.shadow.camera.top = 15;
            sunLight.shadow.camera.bottom = -15;
            scene.add(sunLight);
            
            const blueLight = new THREE.DirectionalLight(0xccddff, 0.3);
            blueLight.position.set(-5, 10, -5);
            scene.add(blueLight);

            controls = new OrbitControls(camera, renderer.domElement);
            controls.enableDamping = true;
            controls.target.set(0, 0, 0);

            document.getElementById('regenButton').addEventListener('click', regenerateVillage);

            // --- Pre-generate texture on init ---
            generateThatchTexture();

            createVillage();

            window.addEventListener('resize', onWindowResize);
            animate();
        }

        function regenerateVillage() {
            if (tileGroup) {
                scene.remove(tileGroup);
                tileGroup.traverse(o => {
                    if (o.geometry) o.geometry.dispose();
                    if (o.material) {
                        if (Array.isArray(o.material)) o.material.forEach(m => m.dispose());
                        else o.material.dispose();
                    }
                });
            }
            createVillage();
        }

        // --- Geometry Helpers ---

        function createOrganicCylinder(radiusTop, radiusBottom, height, segments) {
            // ... (previous code, unchanged) ...
            const geo = new THREE.CylinderGeometry(radiusTop, radiusBottom, height, segments, 3);
            const pos = geo.attributes.position;
            const vec = new THREE.Vector3();
            for (let i = 0; i < pos.count; i++) {
                vec.fromBufferAttribute(pos, i);
                if (vec.y === height/2 || vec.y === -height/2) {
                    const noise = 0.15;
                    vec.x += rand(-noise, noise);
                    vec.z += rand(-noise, noise);
                }
                pos.setXYZ(i, vec.x, vec.y, vec.z);
            }
            geo.computeVertexNormals();
            return geo;
        }

        function applyVertexColors(geometry, color) {
            // ... (previous code, unchanged) ...
            const count = geometry.attributes.position.count;
            const colorAttrib = new THREE.BufferAttribute(new Float32Array(count * 3), 3);
            for (let i = 0; i < count; i++) {
                colorAttrib.setXYZ(i, color.r, color.g, color.b);
            }
            geometry.setAttribute('color', colorAttrib);
        }

        // --- Stone Wall Generator ---
        function createStoneWallMesh(width, depth, targetHeight) {
            // ... (previous code, unchanged) ...
            const geometries = [];
            
            const stoneMaterial = new THREE.MeshStandardMaterial({
                roughness: 0.8,
                flatShading: true,
                vertexColors: true 
            });

            let currentY = 0;
            let courseIndex = 0; 
            
            while (currentY < targetHeight) {
                const courseHeight = rand(0.25, 0.4);
                const isEvenCourse = (courseIndex % 2) === 0;

                const zWallThickness = rand(0.3, 0.5); 
                const xWallThickness = rand(0.3, 0.5); 

                const xStart = isEvenCourse ? -width / 2 : -width / 2 + xWallThickness;
                const xEnd   = isEvenCourse ?  width / 2 :  width / 2 - xWallThickness;

                const zStart = isEvenCourse ? -depth / 2 + zWallThickness : -depth / 2;
                const zEnd   = isEvenCourse ?  depth / 2 - zWallThickness :  depth / 2;

                // Front Wall (Z+)
                let currentX = xStart; 
                while (currentX < xEnd) {
                    const remainingWidth = xEnd - currentX;
                    const stoneWidth = Math.min(rand(0.4, 0.7), remainingWidth); 
                    if (stoneWidth < 0.1) break; 
                    const stoneDepth = zWallThickness; 
                    const stoneGeo = new RoundedBoxGeometry(stoneWidth, courseHeight, stoneDepth, 2, 0.05);
                    const stoneColor = STONE_COLORS[Math.floor(rand(0, STONE_COLORS.length))];
                    applyVertexColors(stoneGeo, stoneColor);
                    stoneGeo.translate(
                        currentX + stoneWidth / 2 + rand(-0.01, 0.01), 
                        currentY + courseHeight / 2, 
                        depth / 2 - zWallThickness / 2 + rand(-0.02, 0.02)
                    );
                    geometries.push(stoneGeo);
                    currentX += stoneWidth; 
                }

                // Back Wall (Z-)
                currentX = xStart;
                while (currentX < xEnd) {
                    const remainingWidth = xEnd - currentX;
                    const stoneWidth = Math.min(rand(0.4, 0.7), remainingWidth); 
                    if (stoneWidth < 0.1) break;
                    const stoneDepth = zWallThickness;
                    const stoneGeo = new RoundedBoxGeometry(stoneWidth, courseHeight, stoneDepth, 2, 0.05);
                    const stoneColor = STONE_COLORS[Math.floor(rand(0, STONE_COLORS.length))];
                    applyVertexColors(stoneGeo, stoneColor);
                    stoneGeo.translate(
                        currentX + stoneWidth / 2 + rand(-0.01, 0.01), 
                        currentY + courseHeight / 2, 
                        -depth / 2 + zWallThickness / 2 + rand(-0.02, 0.02)
                    );
                    geometries.push(stoneGeo);
                    currentX += stoneWidth; 
                }
                
                // Left Wall (X-)
                let currentZ = zStart;
                while (currentZ < zEnd) {
                    const remainingDepth = zEnd - currentZ;
                    const stoneDepth = Math.min(rand(0.4, 0.7), remainingDepth); 
                    if (stoneDepth < 0.1) break;
                    const stoneWidth = xWallThickness; 
                    const stoneGeo = new RoundedBoxGeometry(stoneWidth, courseHeight, stoneDepth, 2, 0.05);
                    const stoneColor = STONE_COLORS[Math.floor(rand(0, STONE_COLORS.length))];
                    applyVertexColors(stoneGeo, stoneColor);
                    stoneGeo.translate(
                        -width / 2 + xWallThickness / 2 + rand(-0.02, 0.02),
                        currentY + courseHeight / 2,
                        currentZ + stoneDepth / 2 + rand(-0.01, 0.01)
                    );
                    geometries.push(stoneGeo);
                    currentZ += stoneDepth; 
                }

                // Right Wall (X+)
                currentZ = zStart;
                while (currentZ < zEnd) {
                    const remainingDepth = zEnd - currentZ;
                    const stoneDepth = Math.min(rand(0.4, 0.7), remainingDepth); 
                    if (stoneDepth < 0.1) break;
                    const stoneWidth = xWallThickness;
                    const stoneGeo = new RoundedBoxGeometry(stoneWidth, courseHeight, stoneDepth, 2, 0.05);
                    const stoneColor = STONE_COLORS[Math.floor(rand(0, STONE_COLORS.length))];
                    applyVertexColors(stoneGeo, stoneColor);
                    stoneGeo.translate(
                        width / 2 - xWallThickness / 2 + rand(-0.02, 0.02),
                        currentY + courseHeight / 2,
                        currentZ + stoneDepth / 2 + rand(-0.01, 0.01)
                    );
                    geometries.push(stoneGeo);
                    currentZ += stoneDepth; 
                }

                currentY += courseHeight; 
                courseIndex++;
            }
            if (geometries.length === 0) return null; 
            const mergedGeo = mergeGeometries(geometries);
            if (!mergedGeo) return null;
            mergedGeo.computeVertexNormals(); 
            const wallMesh = new THREE.Mesh(mergedGeo, stoneMaterial);
            wallMesh.castShadow = true;
            wallMesh.receiveShadow = true;
            return { mesh: wallMesh, finalHeight: currentY };
        }
        
        // --- UPDATED: createSculptedThatchRoof (now accepts sculpt params) ---
        function createSculptedThatchRoof(baseWidth, baseDepth, roofHeight, sagAmount, lumpAmount, lumpFreqX, lumpFreqZ) {
            
            // Roof overhangs walls slightly
            const roofWidth = baseWidth * 1.15; 
            const roofDepth = baseDepth * 1.3;  
            const roofThickness = rand(0.3, 0.5); 
            const halfRoofWidth = roofWidth / 2;
            const halfRoofDepth = roofDepth / 2;

            // --- 1. Geometry: One Box, sculpted ---
            const roofGeo = new THREE.BoxGeometry(roofWidth, roofThickness, roofDepth, 20, 3, 15);

            // --- 2. Sculpting: Displace vertices ---
            const pos = roofGeo.attributes.position;
            const vec = new THREE.Vector3();
            // --- REMOVED: Random factors are now passed in ---

            for (let i = 0; i < pos.count; i++) {
                vec.fromBufferAttribute(pos, i); 
                
                // Calculate the base slope and sag
                const y_slope = (1.0 - Math.abs(vec.x / halfRoofWidth)) * roofHeight;
                const y_sag = (1.0 - (vec.z / halfRoofDepth)**2) * sagAmount; 

                if (vec.y > 0) { 
                    // --- TOP VERTICES ---
                    // Add lumps to the top
                    const y_lump = Math.sin(vec.x * lumpFreqX) * Math.cos(vec.z * lumpFreqZ) * lumpAmount;
                    vec.y = y_slope + y_sag + y_lump + rand(0, 0.02);
                } else { 
                    // --- BOTTOM VERTICES ---
                    // Keep the underside smooth (no lumps)
                    vec.y = y_slope + (y_sag * 0.8) - roofThickness; 
                }
                
                pos.setXYZ(i, vec.x, vec.y, vec.z);
            }
            
            roofGeo.computeVertexNormals();

            // --- 3. Material: Use Base64 texture for top, plain color for sides ---
            const roofTopMaterial = new THREE.MeshStandardMaterial({
                map: generateThatchTexture(),
                roughness: 0.9,
                metalness: 0.0,
            });

            // Order: px, nx, py, ny, pz, nz
            // (right, left, top, bottom, front, back)
            const materials = [
                thatchEdgeMaterial, // right edge
                thatchEdgeMaterial, // left edge
                roofTopMaterial,    // top (the main texture)
                thatchEdgeMaterial, // bottom (unseen)
                thatchEdgeMaterial, // front edge
                thatchEdgeMaterial  // back edge
            ];

            const roofMesh = new THREE.Mesh(roofGeo, materials);
            roofMesh.castShadow = true;
            roofMesh.receiveShadow = true;

            return { mesh: roofMesh, peakY: roofHeight + sagAmount + lumpAmount };
        }

        // --- Main Function ---

        function createVillage() {
            tileGroup = new THREE.Group();
            scene.add(tileGroup);

            // 1. Base Hexagon (Dirt/Ground)
            // ... (previous code, unchanged) ...
            const hexRadius = 7.0;
            const hexHeight = 1.5;
            const hexGeo = new THREE.CylinderGeometry(hexRadius, hexRadius, hexHeight, 6);
            hexGeo.rotateY(Math.PI / 6); 
            const groundMat = new THREE.MeshStandardMaterial({ 
                color: 0x5d4037, 
                roughness: 0.9,
                flatShading: true
            });
            const base = new THREE.Mesh(hexGeo, groundMat);
            base.position.y = -hexHeight / 2;
            base.receiveShadow = true;
            tileGroup.add(base);

            // 2. Grass "Topper"
            // ... (previous code, unchanged) ...
            const grassGeo = new THREE.CylinderGeometry(hexRadius * 0.95, hexRadius * 0.95, 0.2, 6);
            grassGeo.rotateY(Math.PI / 6);
            const grassMat = new THREE.MeshStandardMaterial({ color: 0x4caf50, roughness: 1.0 });
            const grassBase = new THREE.Mesh(grassGeo, grassMat);
            grassBase.position.y = 0.1;
            grassBase.receiveShadow = true;
            tileGroup.add(grassBase);


            // 3. The Well (Center Piece)
            // ... (previous code, unchanged) ...
            const wellGroup = new THREE.Group();
            const wellGeo = createOrganicCylinder(0.8, 0.9, 1.2, 7);
            const stoneMat = new THREE.MeshStandardMaterial({ color: 0x888899, roughness: 0.7, flatShading: true });
            const wellBase = new THREE.Mesh(wellGeo, stoneMat);
            wellBase.position.y = 0.6;
            wellBase.castShadow = true;
            wellGroup.add(wellBase);
            const waterGeo = new THREE.CircleGeometry(0.6, 8);
            waterGeo.rotateX(-Math.PI/2);
            const waterMat = new THREE.MeshStandardMaterial({ color: 0x22aaff, roughness: 0.2, metalness: 0.5 });
            const water = new THREE.Mesh(waterGeo, waterMat);
            water.position.y = 0.8;
            wellGroup.add(water);
            const beamGeo = new THREE.BoxGeometry(0.15, 1.5, 0.15);
            const woodMat = new THREE.MeshStandardMaterial({ color: 0x5c4033, roughness: 1.0 });
            const leftBeam = new THREE.Mesh(beamGeo, woodMat);
            leftBeam.position.set(-0.6, 1.2, 0);
            leftBeam.castShadow = true;
            wellGroup.add(leftBeam);
            const rightBeam = new THREE.Mesh(beamGeo, woodMat);
            rightBeam.position.set(0.6, 1.2, 0);
            rightBeam.castShadow = true;
            wellGroup.add(rightBeam);
            const crossBeam = new THREE.Mesh(new THREE.BoxGeometry(1.6, 0.15, 0.15), woodMat);
            crossBeam.position.set(0, 2.0, 0);
            crossBeam.castShadow = true;
            wellGroup.add(crossBeam);
            const wellRoofGeo = new THREE.ConeGeometry(1.2, 0.8, 4);
            wellRoofGeo.rotateY(Math.PI/4);
            const wellRoofMat = new THREE.MeshStandardMaterial({ color: 0x8d6e63, roughness: 1.0, flatShading: true });
            const wellRoof = new THREE.Mesh(wellRoofGeo, wellRoofMat);
            wellRoof.position.y = 2.4;
            wellRoof.castShadow = true;
            wellGroup.add(wellRoof);
            tileGroup.add(wellGroup);

            // 4. The Huts
            // ... (previous code, unchanged) ...
            const numHuts = Math.floor(rand(3, 6));
            const angleStep = (Math.PI * 2) / numHuts;
            for (let i = 0; i < numHuts; i++) {
                const angle = i * angleStep + rand(-0.2, 0.2);
                const dist = rand(3.5, 5.0);
                const x = Math.cos(angle) * dist;
                const z = Math.sin(angle) * dist;
                createHut(x, z, angle); 
            }
        }

        function createHut(x, z, facingAngle) {
            const hutGroup = new THREE.Group();
            hutGroup.position.set(x, 0, z);
            hutGroup.rotation.y = -facingAngle - Math.PI/2 + rand(-0.3, 0.3);

            // --- Hut Walls ---
            const width = rand(1.8, 2.4);
            const depth = rand(1.5, 2.0);
            const height = rand(1.2, 1.8);
            
            const wallResult = createStoneWallMesh(width, depth, height);
            if (!wallResult) return; 

            const { mesh: walls, finalHeight } = wallResult;
            hutGroup.add(walls);
            
            // --- Door ---
            const doorGeo = new THREE.PlaneGeometry(width * 0.4, height * 0.6);
            const doorMat = new THREE.MeshStandardMaterial({ color: 0x3e2723, side: THREE.DoubleSide });
            const door = new THREE.Mesh(doorGeo, doorMat);
            // Position door on the front wall
            door.position.set(0, height * 0.3, depth / 2 - rand(0.1, 0.2)); 
            hutGroup.add(door);

            // --- Roof ---
            const roofHeight = rand(1.0, 1.5);
            // --- NEW: Define sculpt params so gable can match
            const sagAmount = roofHeight * rand(0.1, 0.2); 
            const lumpAmount = roofHeight * rand(0.05, 0.15); 
            const lumpFreqX = rand(2.5, 4.0);
            const lumpFreqZ = rand(3.5, 5.0);
            
            // Pass the sculpt params to the roof function
            const roofResult = createSculptedThatchRoof(width, depth, roofHeight, sagAmount, lumpAmount, lumpFreqX, lumpFreqZ);
            if (!roofResult) return;

            const { mesh: roof } = roofResult;
            roof.position.y = finalHeight - 0.1; // Position roof on top of wall
            hutGroup.add(roof);

            // --- NEW: Create Sculpted Gables ---
            const gableWidth = width; // Match wall width
            const gableMat = thatchEdgeMaterial; 
            if (!gableMat) console.error("Gable material is null!");
            
            const roofHalfDepth = (depth * 1.3) / 2.0; // Get roof's half-depth
            const halfGableWidth = gableWidth / 2.0;

            // --- Front Gable ---
            const gableFrontGeo = new THREE.PlaneGeometry(gableWidth, roofHeight, 20, 5);
            const gableFrontPos = gableFrontGeo.attributes.position;
            const gableVec = new THREE.Vector3();

            for (let i = 0; i < gableFrontPos.count; i++) {
                gableVec.fromBufferAttribute(gableFrontPos, i);

                // Use the *exact* roof formula for the roof's front edge (z = roofHalfDepth)
                const y_slope = (1.0 - Math.abs(gableVec.x / halfGableWidth)) * roofHeight;
                const y_sag = (1.0 - (roofHalfDepth / roofHalfDepth)**2) * sagAmount; // This is 0
                const y_lump = Math.sin(gableVec.x * lumpFreqX) * Math.cos(roofHalfDepth * lumpFreqZ) * lumpAmount;

                const roofEdgeY = y_slope + y_sag + y_lump;
                
                // Plane Y goes from -roofHeight/2 to +roofHeight/2
                const originalY = gableVec.y + roofHeight / 2;
                
                // Only move vertices *down* to match the roof line
                gableVec.y = Math.min(originalY, roofEdgeY) - roofHeight / 2;

                gableFrontPos.setXYZ(i, gableVec.x, gableVec.y, gableVec.z);
            }
            gableFrontGeo.computeVertexNormals();
            
            const gableFront = new THREE.Mesh(gableFrontGeo, gableMat);
            // Position at wall height, at front wall
            gableFront.position.set(0, finalHeight + roofHeight/2 - 0.1, depth / 2 - 0.15); 
            gableFront.castShadow = true;
            hutGroup.add(gableFront);
            
            // --- Back Gable ---
            const gableBackGeo = new THREE.PlaneGeometry(gableWidth, roofHeight, 20, 5);
            const gableBackPos = gableBackGeo.attributes.position;

            for (let i = 0; i < gableBackPos.count; i++) {
                gableVec.fromBufferAttribute(gableBackPos, i);
                
                // Use the *exact* roof formula for the roof's back edge (z = -roofHalfDepth)
                const y_slope = (1.0 - Math.abs(gableVec.x / halfGableWidth)) * roofHeight;
                const y_sag = (1.0 - (-roofHalfDepth / roofHalfDepth)**2) * sagAmount; // This is 0
                const y_lump = Math.sin(gableVec.x * lumpFreqX) * Math.cos(-roofHalfDepth * lumpFreqZ) * lumpAmount; // Note the -roofHalfDepth

                const roofEdgeY = y_slope + y_sag + y_lump;
                const originalY = gableVec.y + roofHeight / 2;
                gableVec.y = Math.min(originalY, roofEdgeY) - roofHeight / 2;

                gableBackPos.setXYZ(i, gableVec.x, gableVec.y, gableVec.z);
            }
            gableBackGeo.computeVertexNormals();

            const gableBackMesh = new THREE.Mesh(gableBackGeo, gableMat);
            // Position at wall height, at back wall
            gableBackMesh.position.set(0, finalHeight + roofHeight/2 - 0.1, -depth / 2 + 0.15);
            gableBackMesh.rotation.y = Math.PI; // Rotate to face outwards
            gableBackMesh.castShadow = true;
            hutGroup.add(gableBackMesh);

            tileGroup.add(hutGroup);
        }

        function onWindowResize() {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        }

        function animate() {
            requestAnimationFrame(animate);
            controls.update();
            renderer.render(scene, camera);
        }

        init();
    </script>
</body>
</html>
