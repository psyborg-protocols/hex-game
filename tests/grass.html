<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Three.js 3D Grass Tile Demo</title>
    <style>
        body {
            margin: 0;
            font-family: 'Inter', sans-serif;
            background-color: #f0f0f0;
            color: #333;
            overflow: hidden; /* Prevent scrolling */
        }
        #info {
            position: absolute;
            top: 10px;
            width: 100%;
            text-align: center;
            z-index: 10;
            padding: 10px;
            background-color: rgba(255, 255, 255, 0.8);
            border-radius: 8px;
            max-width: 600px;
            left: 50%;
            transform: translateX(-50%);
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
        }
        #info button {
            margin-top: 10px;
            padding: 8px 16px;
            font-size: 14px;
            font-weight: 600;
            color: #fff;
            background-color: #007aff;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            transition: background-color 0.2s;
        }
        #info button:hover {
            background-color: #0056b3;
        }
        #c {
            display: block; /* Remove default canvas margin */
        }
    </style>
</head>
<body>
    <div id="info">
        Drag with your mouse to orbit the shape.
        <br><button id="regenButton">Regenerate Shape</button>
    </div>
    <canvas id="c"></canvas>

    <script type="importmap">
        {
            "imports": {
                "three": "https://cdnjs.cloudflare.com/ajax/libs/three.js/0.167.1/three.module.js",
                "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.167.1/examples/jsm/"
            }
        }
    </script>

    <script type="module">
        import * as THREE from 'three';
        import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
        import { mergeGeometries } from 'three/addons/utils/BufferGeometryUtils.js';

        let scene, camera, renderer, controls;
        let tileMesh; // Mesh for the base tile
        let grassRowMeshes = []; // Array to hold each row of grass
        const clock = new THREE.Clock(); // Re-enabled for animation
        let grassUniforms; // Moved to module scope

        function init() {
            scene = new THREE.Scene();
            scene.background = new THREE.Color(0xf0f0f0);

            camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
            camera.position.set(0, 15, 25); // Adjusted camera position to view the 3D tile

            renderer = new THREE.WebGLRenderer({ antialias: true, canvas: document.querySelector('#c') });
            renderer.setSize(window.innerWidth, window.innerHeight);

            // --- Lights ---
            const ambientLight = new THREE.AmbientLight(0xffffff, 0.6);
            scene.add(ambientLight);

            const directionalLight1 = new THREE.DirectionalLight(0xffffff, 0.8);
            directionalLight1.position.set(5, 10, 7.5);
            scene.add(directionalLight1);

            const directionalLight2 = new THREE.DirectionalLight(0xffffff, 0.5);
            directionalLight2.position.set(-5, -10, -7.5);
            scene.add(directionalLight2);

            // --- Controls ---
            controls = new OrbitControls(camera, renderer.domElement);
            controls.enableDamping = true;
            controls.target.set(0, 5, 0); // Point controls to the center of the tile
            controls.update();

            document.getElementById('regenButton').addEventListener('click', () => {
                // Remove old tile
                if (tileMesh) {
                    scene.remove(tileMesh);
                    tileMesh.geometry.dispose();
                    tileMesh.material.dispose();
                }
                // Remove old grass rows
                grassRowMeshes.forEach(mesh => {
                    scene.remove(mesh);
                    mesh.geometry.dispose();
                    mesh.material.dispose();
                });
                grassRowMeshes = []; // Clear the array

                create3DTileWithGrass();
            });

            create3DTileWithGrass();

            window.addEventListener('resize', onWindowResize, false);
            animate();
        }

        const rand = (v, amount = 0.5) => v + (Math.random() - 0.5) * amount;
        const clamp = (num, min, max) => Math.max(min, Math.min(num, max));

        /**
         * Dynamically generates height factors for a given number of peaks.
         * Creates a tapered array [low, ..., medium, ..., high, ..., medium, ..., low]
         * e.g., for 5 peaks: [0.6, 0.85, 1.0, 0.85, 0.6]
         * e.g., for 7 peaks: [0.6, 0.73, 0.86, 1.0, 0.86, 0.73, 0.6]
         */
        function generateHeightFactors(numPeaks) {
            const factors = new Array(numPeaks);
            const midIndex = Math.floor(numPeaks / 2);
            const minFactor = 0.6;
            const maxFactor = 1.0;

            for (let i = 0; i < numPeaks; i++) {
                // Calculate distance from the center
                const distFromCenter = Math.abs(i - midIndex);
                // Map distance so center is 0.0 and edge is 1.0
                const normDist = midIndex > 0 ? (distFromCenter / midIndex) : 0;
                
                // For an odd number of peaks, midIndex is correct.
                // For an even number, we'll have two "center" peaks.
                // This formula maps 0.0 (center) to 1.0 (maxFactor)
                // and 1.0 (edge) to 0.6 (minFactor).
                if (i === midIndex) {
                     factors[i] = maxFactor;
                } else {
                     // Simple linear interpolation
                     factors[i] = maxFactor - (normDist * (maxFactor - minFactor));
                }

                // Handle case for 1 peak
                if (numPeaks === 1) {
                    factors[0] = maxFactor;
                }
            }
            return factors;
        }


        function create3DTileWithGrass() {
            
            const maxPeakHeight = 8;
            const baseY = 0;
            const grassThickness = 0.01; // Made rows very thin
            const numRows = 5;
            const rowSpacing = 3; // Space between rows

            // --- Define the number of peaks for each row ---
            const peakCounts = [5, 7, 9, 7, 5]; // [back, ..., center, ..., front]


            // --- Create the base tile as a Hexagon ---
            const tileHeight = 1;
            const hexRadius = 7.0; // Radius to fit rows
            
            // A CylinderGeometry with 6 sides is a hexagonal prism.
            const tileGeometry = new THREE.CylinderGeometry(hexRadius, hexRadius, tileHeight, 6);
            
            // --- Rotate the geometry 30 degrees (PI/6) to make it "flat-topped" ---
            // along the Z-axis, matching our row calculation math.
            tileGeometry.rotateY(Math.PI / 6);

            // Position the tile so its top is at baseY
            tileGeometry.translate(0, baseY - tileHeight / 2, 0);
            
            const tileMaterial = new THREE.MeshStandardMaterial({
                color: 0x8B4513, // A dirt/brown color
                roughness: 0.8,
                metalness: 0.0
            });
            
            tileMesh = new THREE.Mesh(tileGeometry, tileMaterial);
            scene.add(tileMesh);

            // --- Create material for the grass (can be reused) ---
            grassUniforms = { // Assign to module-scoped variable
                // Brighter, more vibrant palette
                u_baseColor: { value: new THREE.Color(0x32734A) }, // Brighter, saturated green
                u_tipColor: { value: new THREE.Color(0xC9E868) },  // Bright vibrant lime/yellow
                u_maxHeight: { value: maxPeakHeight },             // Pass in the max height
                u_time: { value: 0.0 }                             // Add time uniform for wind
            };

            const grassMaterial = new THREE.MeshStandardMaterial({
                color: 0x00aa00, // Fallback color
                roughness: 0.7,
                metalness: 0.0,
                side: THREE.DoubleSide // Ensure both sides are visible
            });

            grassMaterial.onBeforeCompile = (shader) => {
                // Add our custom uniforms to the shader
                shader.uniforms.u_baseColor = grassUniforms.u_baseColor;
                shader.uniforms.u_tipColor = grassUniforms.u_tipColor;
                shader.uniforms.u_maxHeight = grassUniforms.u_maxHeight;
                shader.uniforms.u_time = grassUniforms.u_time; // Pass time uniform to shader

                // --- Vertex Shader ---
                // Add a "varying" to pass the world Y position to the fragment shader
                // Add uniform for time
                shader.vertexShader = `
                    varying float v_worldY;
                    uniform float u_time;
                    uniform float u_maxHeight;
                \n` + shader.vertexShader;
                
                // --- 1. Get World Y for Gradient ---
                // We must do this *before* the wind, so wind doesn't affect color.
                // We add this to the <worldpos_vertex> slot.
                shader.vertexShader = shader.vertexShader.replace(
                    '#include <worldpos_vertex>',
                    `
                    #include <worldpos_vertex>
                    // v_worldY is the height of the vertex in the world
                    v_worldY = (modelMatrix * vec4(position, 1.0)).y;
                    `
                );

                // --- 2. Calculate Wind ---
                // We must do this in <begin_vertex> to modify the 'transformed' position
                // *before* it gets used by the rest of the shader.
                shader.vertexShader = shader.vertexShader.replace(
                    '#include <begin_vertex>',
                    `
                    #include <begin_vertex>

                    // How much the vertex should sway (0.0 at base, 1.0 at tip)
                    // We use position.y (local height) for this calculation
                    float swayFactor = smoothstep(0.0, u_maxHeight, position.y);
                    
                    // Wind strength
                    float windStrength = 1.0; 
                    
                    // Wind wave calculation
                    // We use the vertex's world X and Z position to offset the wave,
                    // making the wind "blow" across the grass.
                    vec2 worldPos = (modelMatrix * vec4(position, 1.0)).xz;
                    
                    // A softer, slower wind
                    float windWave = sin(u_time * 0.5 + worldPos.x * 0.3 + worldPos.y * 0.2);
                    
                    // Apply the sway
                    // We displace along the X-axis (side to side)
                    transformed.x += windWave * swayFactor * windStrength;
                    `
                );

                // --- Fragment Shader ---
                // Add the uniforms and varying
                shader.fragmentShader = `
                    uniform vec3 u_baseColor;
                    uniform vec3 u_tipColor;
                    uniform float u_maxHeight;
                    varying float v_worldY;
                \n` + shader.fragmentShader;

                // Find the color fragment and replace it with our gradient logic
                shader.fragmentShader = shader.fragmentShader.replace(
                    '#include <color_fragment>',
                    `
                    #include <color_fragment>
                    
                    // Calculate gradient factor (0.0 at base, 1.0 at max height)
                    // We use smoothstep for a much nicer, softer blend than linear
                    // We multiply by 0.8 so the gradient hits the tip color slightly before the max height
                    float gradientFactor = smoothstep(0.0, u_maxHeight * 0.8, v_worldY); 
                    
                    // Mix the colors based on the factor
                    vec3 gradientColor = mix(u_baseColor, u_tipColor, gradientFactor);
                    
                    // Apply the gradient color. This REPLACES the material's base .color
                    // but keeps all the lighting calculations (diffuse, specular, etc.)
                    diffuseColor.rgb = gradientColor;
                    `
                );
            };

            // --- Create multiple rows of grass ---
            // Z-position of outer rows. Center row is at Z=0.
            const rowPlacementZ = (numRows - 1) * rowSpacing / 2; // e.g., (5-1)*3 / 2 = 6

            for (let r = 0; r < numRows; r++) {
                const currentRowGeometries = []; // Geometries for this row only
                
                // Get the number of peaks for *this* row
                const numPeaks = peakCounts[r];
                // Get the height factors for *this* row
                const heightFactors = generateHeightFactors(numPeaks);

                // Calculate the Z position for this row
                const rowZ = r * rowSpacing - rowPlacementZ; // z = -6, -3, 0, 3, 6

                // --- Calculate the width of the hexagon at this Z ---
                let totalWidth;
                
                // Correct math for a "flat-topped" hexagon
                // We rotated the hex, so "hexRadius" is the distance from center to a point.
                // The distance from center to a flat side is `hexRadius * Math.cos(Math.PI / 6)`
                const hexApothem = hexRadius * Math.sqrt(3) / 2; // ~6.06 for r=7
                const hexMaxX = hexRadius; // Max X value is just the radius
                
                // `rowZ` goes from -6 to 6. `hexApothem` is ~6.06.
                // So all rows are on the flat/tapering side.
                // The width `totalWidth` at a given `rowZ` is:
                if (Math.abs(rowZ) > hexApothem) {
                    totalWidth = 0; // Row is outside the hexagon
                } else {
                     totalWidth = 2 * (hexMaxX - Math.abs(rowZ) / Math.sqrt(3));
                }

                if (totalWidth <= 0) continue; // Skip rows with no width

                const averageSegmentWidth = totalWidth / numPeaks;
                const startX = -totalWidth / 2;

                let currentX = startX;
                let accumulatedWidth = 0; // Track width to ensure total is met

                for (let i = 0; i < numPeaks; i++) {
                    const peakShape = new THREE.Shape();
                    const baseLeftX = currentX;

                    // Randomize segment width
                    const segmentVariation = rand(averageSegmentWidth, averageSegmentWidth * 0.8); // Less variation
                    let effectiveSegmentWidth = clamp(segmentVariation, averageSegmentWidth * 0.5, averageSegmentWidth * 1.5); // Tighter clamp

                    // For the last peak, force it to close the gap to totalWidth
                    if (i === numPeaks - 1) {
                        effectiveSegmentWidth = totalWidth - accumulatedWidth;
                        if (effectiveSegmentWidth < 0) effectiveSegmentWidth = 0; // Safety
                    }

                    const baseRightX = currentX + effectiveSegmentWidth;
                    
                    const currentMaxHeight = maxPeakHeight * heightFactors[i];
                    const peakY = rand(currentMaxHeight, currentMaxHeight * 0.2);
                    const tilt = rand(0, effectiveSegmentWidth * 0.2); // Tilt proportional to current segment width
                    const peakX = (baseLeftX + baseRightX) / 2 + rand(0, 0.2) + tilt;
                    
                    peakShape.moveTo(baseLeftX, baseY); // Start at the base of the tile

                    const bulgeLeftFactor = rand(0.3, 0.2);
                    const tuckLeftFactor = rand(0.2, 0.15);
                    const cp1_leftX = baseLeftX - rand(effectiveSegmentWidth * bulgeLeftFactor, 0.5);
                    const cp1_leftY = baseY + (peakY - baseY) * rand(0.3, 0.1);
                    const cp2_leftX = peakX - rand(effectiveSegmentWidth * tuckLeftFactor, 0.3);
                    const cp2_leftY = peakY - (peakY - baseY) * rand(0.3, 0.1);

                    peakShape.bezierCurveTo(
                        cp1_leftX, cp1_leftY,
                        cp2_leftX, cp2_leftY,
                        peakX, peakY
                    );

                    const tuckRightFactor = rand(0.2, 0.15);
                    const bulgeRightFactor = rand(0.3, 0.2);
                    const cp1_rightX = peakX + rand(effectiveSegmentWidth * tuckRightFactor, 0.3);
                    const cp1_rightY = peakY - (peakY - baseY) * rand(0.3, 0.1);
                    const cp2_rightX = baseRightX + rand(effectiveSegmentWidth * bulgeRightFactor, 0.5);
                    const cp2_rightY = baseY + (peakY - baseY) * rand(0.3, 0.1);

                    peakShape.bezierCurveTo(
                        cp1_rightX, cp1_rightY,
                        cp2_rightX, cp2_rightY,
                        baseRightX, baseY
                    );
                    peakShape.lineTo(baseLeftX, baseY); // Close the shape

                    const extrudeSettings = {
                        depth: grassThickness,
                        bevelEnabled: false
                    };
                    const extrudedGeometry = new THREE.ExtrudeGeometry(peakShape, extrudeSettings);
                    currentRowGeometries.push(extrudedGeometry);

                    currentX = baseRightX;
                    accumulatedWidth += effectiveSegmentWidth;
                }

                // Merge all peaks *in this row*
                let rowGeometry;
                if (currentRowGeometries.length > 0) {
                    rowGeometry = mergeGeometries(currentRowGeometries);
                } else {
                    continue; 
                }

                if (!rowGeometry) {
                    console.error("Failed to merge geometries for row", r);
                    continue;
                }
                
                const rowMesh = new THREE.Mesh(rowGeometry, grassMaterial);
                // Position this row at its correct Z coordinate
                rowMesh.position.z = rowZ; 
                
                scene.add(rowMesh);
                grassRowMeshes.push(rowMesh); 
            }
        }

        function onWindowResize() {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        }

        function animate() {
            requestAnimationFrame(animate);
            controls.update();

            // --- Update Wind Animation ---
            const elapsedTime = clock.getElapsedTime();

            // Since the material is shared, we just update the source uniform
            if (grassUniforms) { // Check if grassUniforms is initialized
                grassUniforms.u_time.value = elapsedTime;
            }

            renderer.render(scene, camera);
        }

        init();
    </script>
</body>
</html>
